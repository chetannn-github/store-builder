apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: medusa-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # Ports Expose
          ports:
            - name: backend
              containerPort: 9000
            - name: admin
              containerPort: 7001
          
          env:
            - name: DATABASE_TYPE
              value: "postgres"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@{{ .Release.Name }}-db:5432/medusa-store"
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-db:6379"
            - name: NODE_ENV
              value: "development"
            - name: JWT_SECRET
              value: {{ .Values.secrets.jwt | default "supersecret" | quote }}
            - name: COOKIE_SECRET
              value: {{ .Values.secrets.cookie | default "supersecret" | quote }}
            
            # 🚨 DYNAMIC CORS SETTINGS (Bahut Important)
            # Backend ko bata rahe hain ki Admin kahan se request karega
            - name: ADMIN_CORS
              value: "http://admin-{{ .Values.slug }}.{{ .Values.domain }},https://admin-{{ .Values.slug }}.{{ .Values.domain }}"
            
            # Storefront
            - name: STORE_CORS
              value: "http://{{ .Values.slug }}.{{ .Values.domain }},https://{{ .Values.slug }}.{{ .Values.domain }},http://localhost:8000,https://test-shop.instaconnector.in"
            
            - name: ADMIN_EMAIL
              value: {{ .Values.adminUser.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.adminUser.password | quote }}

          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              echo "⏳ Running Migrations..."
              npx medusa db:migrate
              
              echo "👤 Creating Admin User..."
              npx medusa user -e $ADMIN_EMAIL -p $ADMIN_PASSWORD || true
              
              echo "🚀 Starting Medusa (Backend + Admin)..."
              # 'medusa develop' backend (9000) aur admin (7001) dono chalata hai dev mode mein
              npx medusa develop
          
          # Health Check (Backend Port)
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 10