apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.store.port }}
              protocol: TCP
          
          lifecycle:
            postStart:
              exec:
                command: 
                  - "/bin/bash"
                  - "-c"
                  - >
                    echo "Waiting for WordPress Setup...";
                    sleep 30;
                    # Logic to pick the right URL
                    {{- if .Values.ingress.customDomain }}
                    CURRENT_URL="{{ .Values.ingress.protocol }}{{ .Values.ingress.customDomain }}";
                    {{- else }}
                    CURRENT_URL="{{ .Values.ingress.protocol }}{{ .Values.ingress.host }}";
                    {{- end }}
                    
                    wp option update siteurl "$CURRENT_URL" --allow-root;
                    wp option update home "$CURRENT_URL" --allow-root;
                    wp plugin activate woocommerce --allow-root;
                    echo "WooCommerce Activated on $CURRENT_URL!";

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: "{{ .Release.Name }}-db"
            - name: WORDPRESS_DATABASE_USER
              value: "bn_wordpress"
            - name: WORDPRESS_DATABASE_PASSWORD
              value: "secret123"
            - name: WORDPRESS_DATABASE_NAME
              value: "bitnami_wordpress"
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: WORDPRESS_USERNAME
              value: {{ default "user" .Values.wordpressUsername | quote }}
            - name: WORDPRESS_PASSWORD
              value: {{ default "bitnami" .Values.wordpressPassword | quote }}
            - name: WORDPRESS_EMAIL
              value: {{ default "user@example.com" .Values.wordpressEmail | quote }}
            - name: WORDPRESS_SITE_URL
              # Environment variable update
              value: "{{ .Values.ingress.protocol }}{{ .Values.ingress.customDomain | default .Values.ingress.host }}"