replicaCount: 1

image:
  repository: chetannn/custom-store-builder
  pullPolicy: IfNotPresent
  tag: "v1"

store:
  type: "woocommerce"
  port: 8080  

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  host: "store.localhost" 
  customDomain: ""  
  protocol: "http://"
  scheme: "http"


wordpressUsername: "admin"
wordpressPassword: "password123"
wordpressEmail: "admin@example.com"

resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"